<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
   
    <title>DevClub Convert Money</title>
</head>
<body>
    <img class="logo" src="assets/logo-sem-fundo.gif" alt="logo-devclub-convert-money">
    <main>
        <label>
            Converter <b>de:</b>
            <select class="currency-select-up">
                <option value="BRL">R$ Real brasileiro</option>
                <option value="USD">US$ Dólar americano</option>
                <option value="EUR">€ Euro</option>  
                <option value="JPY">¥ Iene japonês</option>
                <option value="GBP">£ Libra esterlina</option>
            </select>
        </label>

         <label>
            Converter <b>para:</b>
            <select class="currency-select-down">
                <option value="USD">US$ Dólar americano</option>
                <option value="EUR">€ Euro</option>
                <option value="BRL">R$ Real brasileiro</option>
                <option value="JPY">¥ Iene japonês</option>
                <option value="GBP">£ Libra esterlina</option>   
            </select>
        </label>

        <label>
            Valor:
            <input class="currency-input" type="number" placeholder="1.000,00" />

            <button class="convert-button">Converter</button>
            
            <section>
                <div class="currency-box">
                    <img class="currency-img-up" src="assets/real.png" alt="logo-moeda-a-converter">
                    <p class="currency-name-up">Real:</p>
                    <p class="currency-value-to-convert">R$ 0,00</p>
                </div>

                <img class="arrow-img" src="assets/arrow.png" alt="seta-conversao ">

                <div class="currency-box">
                    <img class="currency-img-down" src="assets/dolar.png" alt="logo-moeda-convertida">
                    <p class="currency-name-down">Dólar:</p>
                    <p class="currency-value">US$ 0,00</p>
                </div>
            </section>
    </main>

</body>
 <script src="script.js"></script>
</html>
